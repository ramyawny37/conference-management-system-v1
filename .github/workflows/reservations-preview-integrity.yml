name: Reservations Preview Integrity

on:
  push:
    branches: [develop]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'modules/reservations/**'
      - 'tests/reservations-preview-source-integrity.test.js'
      - 'tests/reservations-manual-person-identity-resolution.test.js'
      - 'tests/reservations-identity-replay-order.test.js'
      - 'tools/validation/check-development-preview.cjs'
      - '.github/workflows/reservations-preview-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservations-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reservations bundle and canonical identity
        run: node --test tests/reservations-preview-source-integrity.test.js tests/reservations-manual-person-identity-resolution.test.js tests/reservations-identity-replay-order.test.js
