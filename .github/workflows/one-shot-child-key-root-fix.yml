name: One-shot child key root fix
on:
  push:
    branches: [develop]
    paths:
      - 'tmp/child-key-root-fix-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical child classification fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = """function isCanonicalAccommodationChild(occupancy){
  return !!occupancy&&(occupancy.bedType==='shared'||occupancy.extraBedPersonType==='child'||!!occupancy.guardianParticipationId);
}"""
          new = """function isCanonicalAccommodationChild(occupancy){
  if(!occupancy)return false;
  if(occupancy.bedType==='shared'||occupancy.extraBedPersonType==='child'||!!occupancy.guardianParticipationId)return true;
  var participationId=String(occupancy.participationId||'').trim();
  if(!participationId)return false;
  try{
    var current=typeof getCurrentConference==='function'?getCurrentConference():null;
    var integration=window.PlatformIntegration;
    if(!current||!integration||typeof integration.getConferenceParticipationState!=='function')return false;
    var state=integration.getConferenceParticipationState(current.id);
    var item=(state&&Array.isArray(state.items)?state.items:[]).find(function(participation){
      return String(participation&&participation.participationId||'')===participationId;
    });
    return !!(item&&item.guardianParticipationId);
  }catch(error){
    return false;
  }
}"""
          if old not in s:
              raise SystemExit('EXPECTED_CHILD_CLASSIFIER_NOT_FOUND')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify source
        run: |
          node --check script.js
          node --test tests/conference-people-canonical-flow.test.js
      - name: Commit root fix and remove one-shot artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tmp/child-key-root-fix-trigger.txt .github/workflows/one-shot-child-key-root-fix.yml
          git add script.js tmp/child-key-root-fix-trigger.txt .github/workflows/one-shot-child-key-root-fix.yml
          git commit -m 'fix: classify accommodation child from canonical participation relationship'
          git push origin HEAD:develop
