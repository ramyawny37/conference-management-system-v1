name: Apply accommodation UI fix

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Patch canonical accommodation UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')

          if '>مشترك</option>' not in s:
              raise SystemExit('child bed option marker not found')
          s = s.replace('>مشترك</option>', '>بدون سرير</option>', 1)
          if "?(bedType==='shared'?'مشترك':" not in s:
              raise SystemExit('child bed display marker not found')
          s = s.replace("?(bedType==='shared'?'مشترك':", "?(bedType==='shared'?'بدون سرير':", 1)

          child_return = "    return '<div class=\\\"guest-person-row canonical-room-guest canonical-room-child\\\" data-bed-type=\\\"'+bedType+'\\\" data-canonical-stay=\\\"'+id+'\\\"><div class=\\\"guest-slot-person\\\"><strong>↳ '+esc(person.fullName||'نزيل بدون اسم')+'</strong>'+(unlinked?'<div class=\\\"person-meta\\\">ربط ولي الأمر مفقود</div>':'')+'</div>'+childBed+'</div>';"
          if child_return not in s:
              raise SystemExit('child renderer marker not found')
          child_replacement = "    var childActions=canManage?'<button type=\\\"button\\\" class=\\\"btn btn-red btn-sm\\\" onclick=\\\"removeCanonicalAccommodation(\\\\''+id+'\\\\')\\\">إزالة من الغرفة</button>':'';\\n" + child_return.replace("'+childBed+'</div>';", "'+childBed+childActions+'</div>';", 1)
          s = s.replace(child_return, child_replacement, 1)

          guard = 'canManage&&!hasLinkedChildren?'
          if guard not in s:
              raise SystemExit('guardian replacement guard marker not found')
          s = s.replace(guard, 'canManage?', 1)
          warning = "+(canManage&&hasLinkedChildren?'<small class=\\\"person-meta\\\">الاستبدال غير متاح قبل معالجة ارتباط الأطفال</small>':'')"
          if warning not in s:
              raise SystemExit('guardian warning marker not found')
          s = s.replace(warning, '', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(accommodation): restore child removal and guardian replacement"
          git push origin develop
