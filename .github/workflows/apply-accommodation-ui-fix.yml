name: Apply accommodation UI fix

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Correct canonical accommodation UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          changed=[]

          s2,n=re.subn(r"^\s*var childActions=canManage\?.*?;$", r'''    var childActions=canManage?'<button type=\"button\" class=\"btn btn-red btn-sm\" onclick=\"removeCanonicalAccommodation(\\''+id+'\\')\">إزالة من الغرفة</button>':'';''', s, count=1, flags=re.M)
          if n:
              s=s2; changed.append('child-action-escaping')

          warning="+(canManage&&hasLinkedChildren?'<small class=\"person-meta\">الاستبدال غير متاح قبل معالجة ارتباط الأطفال</small>':'')"
          if warning in s:
              s=s.replace(warning,'',1); changed.append('guardian-warning')

          if not changed:
              raise SystemExit('no final UI correction markers found')
          print('Final accommodation UI corrections:',changed)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(accommodation): correct child action escaping"
          git push origin develop
