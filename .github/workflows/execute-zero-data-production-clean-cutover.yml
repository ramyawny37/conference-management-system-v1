name: Execute zero-data Production clean cutover
on:
  workflow_dispatch:
jobs:
  production-clean-cutover:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Fail-closed Production identity and canonical artifact checks
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_DATABASE_URL:-}" || { echo 'BLOCKED: PRODUCTION_DATABASE_URL secret is not configured'; exit 1; }
          node tools/production-release/check-zero-data-replacement-readiness.cjs >/tmp/readiness.json
          node -e 'const r=require("/tmp/readiness.json"); if(r.ready!==true||r.targetProjectRef!=="mpezfbvcdfxpgflehuot") process.exit(1)'
          node - <<'NODE'
          const u=new URL(process.env.PRODUCTION_DATABASE_URL);
          const identity=u.hostname+" "+decodeURIComponent(u.username);
          if(!identity.includes("mpezfbvcdfxpgflehuot")) throw new Error("WRONG_PRODUCTION_DATABASE");
          if(identity.includes("gppwltrifgfxrkzvvxoe")) throw new Error("DEVELOPMENT_DATABASE_FORBIDDEN");
          NODE
          expected="$(node -p 'require("./tools/production-release/canonical-clean-bootstrap-evidence.json").bootstrapSha256')"
          actual="$(sha256sum tools/production-release/canonical-clean-bootstrap.sql | awk '{print $1}')"
          test "$actual" = "$expected" || { echo 'BLOCKED: canonical bootstrap hash mismatch'; exit 1; }
          if grep -Fq -- '-- Data for Name:' tools/production-release/canonical-clean-bootstrap.sql || grep -Eiq '^COPY[[:space:]].*FROM[[:space:]]+stdin;' tools/production-release/canonical-clean-bootstrap.sql; then echo 'BLOCKED: bootstrap contains data'; exit 1; fi
          if grep -Eiq '^CREATE[[:space:]]+SCHEMA[[:space:]]+"?public"?[[:space:]]*;' tools/production-release/canonical-clean-bootstrap.sql; then echo 'BLOCKED: bootstrap attempts to replace managed public namespace'; exit 1; fi
          if grep -Eiq 'ALTER[[:space:]]+DEFAULT[[:space:]]+PRIVILEGES[[:space:]]+FOR[[:space:]]+ROLE[[:space:]]+"?supabase_admin"?' tools/production-release/canonical-clean-bootstrap.sql; then echo 'BLOCKED: bootstrap attempts to rewrite managed default privileges'; exit 1; fi
          for file in tools/production-release/prepare-canonical-application-replacement.sql tools/production-release/canonical-clean-bootstrap.sql tools/production-release/canonical-system-catalog-seed.sql tools/production-release/assert-canonical-*.sql tools/production-release/assert-first-owner-device-security.sql; do
            if grep -Eiq '^[[:space:]]*(BEGIN|COMMIT|ROLLBACK)[[:space:]]*;' "$file"; then echo "BLOCKED: nested transaction marker in $file"; exit 1; fi
            if grep -Eiq '^[[:space:]]*\\(i|ir)[[:space:]]' "$file"; then echo "BLOCKED: relative psql include in $file"; exit 1; fi
          done
      - name: Replace only application schemas atomically and seed canonical catalog
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=15
          cutover="$(mktemp /tmp/canonical-production-cutover-XXXXXX.sql)"
          trap 'rm -f "$cutover"' EXIT
          {
            echo 'BEGIN;'
            cat tools/production-release/prepare-canonical-application-replacement.sql
            cat tools/production-release/canonical-clean-bootstrap.sql
            cat tools/production-release/canonical-system-catalog-seed.sql
            cat tools/production-release/assert-canonical-full-foundation.sql
            cat tools/production-release/assert-canonical-structural-parity.sql
            cat tools/production-release/assert-first-owner-device-security.sql
            cat tools/production-release/assert-canonical-access-parity.sql
            cat tools/production-release/assert-canonical-ambient-grants.sql
            cat tools/production-release/assert-canonical-default-grants.sql
            echo 'COMMIT;'
          } > "$cutover"
          psql "$PRODUCTION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$cutover"
      - name: Post-cutover read-only security audit
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$PRODUCTION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tools/production-release/canonical-clean-bootstrap-readonly-audit.sql
