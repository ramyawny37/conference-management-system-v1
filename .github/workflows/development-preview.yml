name: Deploy Development Preview

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}conference-management-system-development-preview/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v6
        with:
          ref: main
          path: site

      - name: Checkout development preview
        uses: actions/checkout@v6
        with:
          ref: develop
          path: develop-source

      - name: Build isolated preview directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/conference-management-system-development-preview
          mkdir -p site/conference-management-system-development-preview
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            develop-source/ site/conference-management-system-development-preview/
          printf '%s\n' "${GITHUB_SHA}" > site/conference-management-system-development-preview/development-preview-source.txt
          rm -rf site/.git site/.github

      - name: Validate platform resource lease client
        shell: bash
        run: |
          set -euo pipefail
          node --check develop-source/js/platform-integration.js
          node --check develop-source/js/sync/discovered-conference-open-service.js
          node --check develop-source/script.js
          cd develop-source
          node --test tests/platform-resource-lease-client.test.js tests/discovered-conference-open-service.test.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
