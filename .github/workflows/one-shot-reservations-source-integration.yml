name: One-shot canonical Reservations source integration
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/one-shot-reservations-source-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Platform develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Checkout exact Reservations source
        uses: actions/checkout@v4
        with:
          repository: ramyawny37/reservation-management-system
          ref: 00eabbedf83e51181071a2474c07cb7175b22302
          token: ${{ secrets.RESERVATIONS_SOURCE_TOKEN }}
          path: reservations-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact canonical module
        working-directory: reservations-source
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build:platform-module
          cp contracts/platform-runtime-contract.json dist/platform-module/reservations-contract.json
          test "$(sha256sum dist/platform-module/reservations-module.js | cut -d' ' -f1)" = "89248a853d89107d54e9f0d88dbe65c43dc76e8d54153251f9fd9b0b8d1a76d9"
          test "$(sha256sum dist/platform-module/reservations-module.css | cut -d' ' -f1)" = "2b4edb80f5993e48b8c1ecc7f4209774be583c97b63fd5a8e1c81164caca07be"
          (cd dist/platform-module && zip -q /tmp/reservations.zip reservations-module.js reservations-module.css reservations-contract.json)
      - name: Integrate through canonical guarded tool
        run: node tools/integrate-reservations-artifact.cjs /tmp/reservations.zip
      - name: Verify and self-remove
        run: |
          node --check modules/reservations/reservations-module.js
          node --test tests/reservations-artifact-policy.test.js
          rm -rf reservations-source
          rm .github/workflows/one-shot-reservations-source-integration.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add modules/reservations/reservations-module.js modules/reservations/reservations-module.css modules/reservations/reservations-contract.json index.html service-worker.js tools/reservations-artifact-policy.json .github/workflows/one-shot-reservations-source-integration.yml
          git diff --cached --check
          git commit -m "fix(reservations): integrate verified registration requests workspace"
          git push origin HEAD:develop
