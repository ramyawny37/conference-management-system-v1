name: Validate zero-data production preparation
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'tools/production-release/export-development-schema-only.cjs'
      - 'tools/production-release/application-bootstrap-contract.cjs'
      - 'tools/production-release/prepare-canonical-application-replacement.sql'
      - 'tools/production-release/check-zero-data-replacement-readiness.cjs'
      - 'tests/production-zero-data-export-guards.test.js'
      - 'tests/fixtures/production-release-catalog-contract.sql'
      - 'tools/production-release/canonical-system-catalog-seed.sql'
      - 'tools/production-release/canonical-system-catalog-fingerprint.sql'
      - 'tools/production-release/assert-canonical-full-foundation.sql'
      - 'tools/production-release/assert-canonical-structural-parity.sql'
      - 'tools/production-release/canonical-function-semantic-fingerprint.sql'
      - 'tools/production-release/assert-first-owner-device-security.sql'
      - 'tools/production-release/assert-canonical-access-parity.sql'
      - 'tools/production-release/assert-canonical-ambient-grants.sql'
      - 'tools/production-release/assert-canonical-default-grants.sql'
      - 'tools/production-release/rehearse-clean-bootstrap.sh'
      - 'tests/fixtures/supabase-managed-foundation.sql'
      - 'tools/production-release/canonical-full-foundation-acceptance.sql'
      - '.github/workflows/validate-zero-data-production-preparation.yml'
      - 'supabase/functions/**'
jobs:
  development-schema-export:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          test "$(/usr/lib/postgresql/17/bin/pg_config --version | awk '{print $2}' | cut -d. -f1)" = "17" || { echo 'BLOCKED: PostgreSQL 17 client is unavailable'; exit 1; }
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Extract Development schema and ACL locally, without publishing dump
        shell: bash
        env:
          DEVELOPMENT_DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${DEVELOPMENT_DATABASE_URL:-}" || { echo 'BLOCKED: Development database secret is not configured'; exit 1; }
          node tools/production-release/export-development-schema-only.cjs
          test -s .release-local/development-application-schema-only.sql
          echo 'Development function semantic fingerprints (metadata only):'
          psql "$DEVELOPMENT_DATABASE_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 -f tools/production-release/canonical-function-semantic-fingerprint.sql
          echo 'EXTRACTED_NOT_VALIDATED: local ephemeral schema only; no artifact uploaded, no Production connection'
      - name: Rehearse extracted schema on disposable PostgreSQL 17
        shell: bash
        env:
          PGPASSWORD: ci_disposable_only
        run: |
          set -euo pipefail
          docker run -d --rm --name release-rehearsal-pg -e POSTGRES_USER=supabase_admin -e POSTGRES_PASSWORD=ci_disposable_only -p 55432:5432 supabase/postgres:17.6.1.136
          trap 'docker rm -f release-rehearsal-pg >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if /usr/lib/postgresql/17/bin/pg_isready -h 127.0.0.1 -p 55432 -U supabase_admin -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          /usr/lib/postgresql/17/bin/createdb -h 127.0.0.1 -p 55432 -U supabase_admin -O supabase_admin release_rehearsal_ci
          RELEASE_DISPOSABLE_REHEARSAL=I_UNDERSTAND_DISPOSABLE_ONLY \
          PGHOST=127.0.0.1 PGPORT=55432 PGUSER=supabase_admin PGDATABASE=release_rehearsal_ci \
          bash tools/production-release/rehearse-clean-bootstrap.sh "$PWD/.release-local/development-application-schema-only.sql"
      - name: Stage proven clean bootstrap artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp .release-local/development-application-schema-only.sql canonical-clean-bootstrap.sql
          sha256sum canonical-clean-bootstrap.sql > canonical-clean-bootstrap.sha256
      - name: Upload proven clean bootstrap artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-clean-bootstrap-${{ github.sha }}
          path: |
            canonical-clean-bootstrap.sql
            canonical-clean-bootstrap.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Commit proven canonical bootstrap and evidence to develop
        if: success()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p tools/production-release
          cp canonical-clean-bootstrap.sql tools/production-release/canonical-clean-bootstrap.sql
          bootstrap_sha="$(sha256sum canonical-clean-bootstrap.sql | awk '{print $1}')"
          cat > tools/production-release/canonical-clean-bootstrap-evidence.json <<EOF
          {
            "sourceProjectRef": "gppwltrifgfxrkzvvxoe",
            "targetProjectRef": "mpezfbvcdfxpgflehuot",
            "dataMigration": false,
            "localBootstrap": "PASS",
            "ownerDeviceLifecycle": "PASS",
            "securityAudit": "PASS",
            "reviewed": true,
            "sourceCommit": "$SOURCE_SHA",
            "workflowRunId": "$SOURCE_RUN_ID",
            "bootstrapSha256": "$bootstrap_sha"
          }
          EOF
          git add tools/production-release/canonical-clean-bootstrap.sql tools/production-release/canonical-clean-bootstrap-evidence.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: record proven canonical clean bootstrap"
          git push origin HEAD:develop
      - name: Remove extracted schema from runner
        if: always()
        shell: bash
        run: rm -f .release-local/development-application-schema-only.sql canonical-clean-bootstrap.sql canonical-clean-bootstrap.sha256
  zero-data-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check tools/production-release/export-development-schema-only.cjs
          node --check tools/production-release/application-bootstrap-contract.cjs
          node --check tools/production-release/check-zero-data-replacement-readiness.cjs
          node --check tests/production-zero-data-export-guards.test.js
      - name: Verify canonical Edge Function sources are complete
        shell: bash
        run: |
          set -euo pipefail
          for slug in platform-device-authorization platform-device-ownership-handoff platform-device-session conference-device-operation platform-device-enrollment platform-device-operation; do
            test -s "supabase/functions/$slug/index.ts"
            test -s "supabase/functions/$slug/deno.json"
          done
      - name: Run offline security guard tests
        run: node --test tests/production-zero-data-export-guards.test.js
      - name: Verify zero-data Production replacement readiness
        shell: bash
        run: |
          set -euo pipefail
          node tools/production-release/check-zero-data-replacement-readiness.cjs > readiness.json
          node -e 'const r=require("./readiness.json"); if(r.ready!==true || r.checks.some(x=>x.status!=="PASS")) process.exit(1)'
          cat readiness.json
          rm readiness.json
  disposable-catalog-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: release_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: release_contract
      PGPASSWORD: ci_disposable_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify replay tool rejects hosted connections before SQL
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RELEASE_DISPOSABLE_REHEARSAL=I_UNDERSTAND_DISPOSABLE_ONLY PGHOST=db.mpezfbvcdfxpgflehuot.supabase.co PGDATABASE=release_rehearsal_test PGUSER=postgres PGPASSWORD=disposable bash tools/production-release/rehearse-clean-bootstrap.sh "$PWD/tests/fixtures/production-release-catalog-contract.sql" > /tmp/host-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'Only local PostgreSQL host is permitted' /tmp/host-negative.log
      - name: Verify local rehearsal rejects libpq address and service redirects
        shell: bash
        run: |
          set -euo pipefail
          for override in PGHOSTADDR PGSERVICE PGSERVICEFILE; do
            set +e
            env RELEASE_DISPOSABLE_REHEARSAL=I_UNDERSTAND_DISPOSABLE_ONLY PGHOST=localhost PGDATABASE=release_rehearsal_test PGUSER=postgres PGPASSWORD=ci_disposable_only "$override=forbidden" bash tools/production-release/rehearse-clean-bootstrap.sh "$PWD/tests/fixtures/production-release-catalog-contract.sql" > /tmp/redirect-negative.log 2>&1
            status=$?
            set -e
            test "$status" -ne 0
            grep -Eq 'override forbidden|overrides forbidden' /tmp/redirect-negative.log
          done
      - name: Reject schema-only dump with stripped ACLs before connecting
        shell: bash
        run: |
          set -euo pipefail
          dump="$(mktemp /tmp/release-schema-only-XXXXXX.sql)"
          printf '%s\n' '-- PostgreSQL database dump' 'CREATE TABLE public.fixture (id integer);' > "$dump"
          set +e
          env RELEASE_DISPOSABLE_REHEARSAL=I_UNDERSTAND_DISPOSABLE_ONLY PGHOST=localhost PGDATABASE=release_rehearsal_test PGUSER=postgres PGPASSWORD=ci_disposable_only bash tools/production-release/rehearse-clean-bootstrap.sh "$dump" > /tmp/missing-acl-negative.log 2>&1
          status=$?
          set -e
          rm -f "$dump"
          test "$status" -ne 0
          grep -F 'Schema-only dump lacks GRANT or ALTER DEFAULT PRIVILEGES replay' /tmp/missing-acl-negative.log
      - name: Reject unsafe libpq options before database connection
        shell: bash
        run: |
          set -euo pipefail
          dump="$(mktemp /tmp/release-schema-only-XXXXXX.sql)"
          printf '%s\n' '-- PostgreSQL database dump' 'GRANT USAGE ON SCHEMA public TO authenticated;' 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO authenticated;' > "$dump"
          for override in PGOPTIONS=-csearch_path=public PGPORT=not_a_port; do
            set +e
            env RELEASE_DISPOSABLE_REHEARSAL=I_UNDERSTAND_DISPOSABLE_ONLY PGHOST=localhost PGDATABASE=release_rehearsal_test PGUSER=postgres PGPASSWORD=ci_disposable_only "$override" bash tools/production-release/rehearse-clean-bootstrap.sh "$dump" > /tmp/libpq-negative.log 2>&1
            status=$?
            set -e
            test "$status" -ne 0
            grep -Eq 'PGOPTIONS override forbidden|PGPORT must be numeric' /tmp/libpq-negative.log
          done
          rm -f "$dump"
      - name: Assert incomplete foundation is rejected
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-full-foundation.sql > /tmp/foundation-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_OBJECT_COUNT_MISMATCH' /tmp/foundation-negative.log
      - name: Assert exact structural parity rejects incomplete schema
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-structural-parity.sql > /tmp/parity-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_STRUCTURAL_PARITY_FAILED' /tmp/parity-negative.log
      - name: Assert first-owner and device gate rejects incomplete foundation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-first-owner-device-security.sql > /tmp/owner-device-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'OWNER_DEVICE_SECURITY_MISSING_PRIVATE_TABLE' /tmp/owner-device-negative.log
      - name: Assert access parity rejects missing grants
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-access-parity.sql > /tmp/access-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_ACCESS_PARITY_FAILED' /tmp/access-negative.log
      - name: Assert ambient grants reject incomplete foundation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-ambient-grants.sql > /tmp/ambient-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_AMBIENT_GRANTS_FAILED' /tmp/ambient-negative.log
      - name: Assert missing default privileges are rejected
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-default-grants.sql > /tmp/default-grants-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_DEFAULT_GRANTS_FAILED' /tmp/default-grants-negative.log
      - name: Create disposable catalog contract and replay seed twice
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/production-release-catalog-contract.sql
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql
      - name: Verify seed rejects incompatible pre-existing catalog atomically
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "UPDATE platform.permissions SET allowed_scope_mode='intentionally_corrupt' WHERE code=(SELECT code FROM platform.permissions WHERE is_system ORDER BY code LIMIT 1)"
          set +e
          { echo 'BEGIN;'; cat tools/production-release/canonical-system-catalog-seed.sql; echo 'COMMIT;'; } > /tmp/seed-transaction.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/seed-transaction.sql > /tmp/seed-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "Canonical system catalog fingerprint mismatch" /tmp/seed-negative.log
          psql -v ON_ERROR_STOP=1 -c "TRUNCATE platform.role_permissions, platform.permissions, platform.roles RESTART IDENTITY CASCADE"
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql > /dev/null
      - name: Compare catalog fingerprints against Development read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-fingerprint.sql)"
          echo "$result" | grep -Fx 'permissions|84|2225bd16e2d1478d777fba4e3b12afc7'
          echo "$result" | grep -Fx 'role_permissions|79|90e6d71f8203c6789bb6d956daff7cce'
          echo "$result" | grep -Fx 'roles|8|cdd80e0770d5f40e3f70e3ecaf3e9272'
          test "$(echo "$result" | wc -l)" -eq 3
