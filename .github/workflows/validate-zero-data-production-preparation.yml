name: Validate zero-data production preparation
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'tools/production-release/export-development-schema-only.cjs'
      - 'tools/production-release/check-zero-data-replacement-readiness.cjs'
      - 'tests/production-zero-data-export-guards.test.js'
      - 'tests/fixtures/production-release-catalog-contract.sql'
      - 'tools/production-release/canonical-system-catalog-seed.sql'
      - 'tools/production-release/canonical-system-catalog-fingerprint.sql'
      - 'tools/production-release/assert-canonical-full-foundation.sql'
      - 'tools/production-release/assert-canonical-structural-parity.sql'
      - 'tools/production-release/assert-first-owner-device-security.sql'
      - 'tools/production-release/rehearse-clean-bootstrap.sh'
      - 'tools/production-release/canonical-full-foundation-acceptance.sql'
      - '.github/workflows/validate-zero-data-production-preparation.yml'
      - 'supabase/functions/**'
jobs:
  zero-data-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check tools/production-release/export-development-schema-only.cjs
          node --check tools/production-release/check-zero-data-replacement-readiness.cjs
          node --check tests/production-zero-data-export-guards.test.js
      - name: Verify canonical Edge Function sources are complete
        shell: bash
        run: |
          set -euo pipefail
          for slug in platform-device-authorization platform-device-ownership-handoff platform-device-session conference-device-operation platform-device-enrollment platform-device-operation; do
            test -s "supabase/functions/$slug/index.ts"
            test -s "supabase/functions/$slug/deno.json"
          done
      - name: Run offline security guard tests
        run: node --test tests/production-zero-data-export-guards.test.js
      - name: Verify production replacement remains blocked without proven clean bootstrap
        shell: bash
        run: |
          set +e
          node tools/production-release/check-zero-data-replacement-readiness.cjs > readiness.json
          status=$?
          set -e
          test "$status" -eq 1
          node -e 'const r=require("./readiness.json"); if(r.ready!==false || !r.checks.some(x=>x.name==="clean_bootstrap_evidence" && x.status==="BLOCKED")) process.exit(1)'
          rm readiness.json
  disposable-catalog-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: release_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: release_contract
      PGPASSWORD: ci_disposable_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify replay tool rejects hosted connections before SQL
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RELEASE_DISPOSABLE_REHEARSAL=I_UNDERSTAND_DISPOSABLE_ONLY PGHOST=db.mpezfbvcdfxpgflehuot.supabase.co PGDATABASE=release_rehearsal_test PGUSER=postgres PGPASSWORD=disposable bash tools/production-release/rehearse-clean-bootstrap.sh "$PWD/tests/fixtures/production-release-catalog-contract.sql" > /tmp/host-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'Only local PostgreSQL host is permitted' /tmp/host-negative.log
      - name: Assert incomplete foundation is rejected
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-full-foundation.sql > /tmp/foundation-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_OBJECT_COUNT_MISMATCH' /tmp/foundation-negative.log
      - name: Assert exact structural parity rejects incomplete schema
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-canonical-structural-parity.sql > /tmp/parity-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'FOUNDATION_STRUCTURAL_PARITY_FAILED' /tmp/parity-negative.log
      - name: Assert first-owner and device gate rejects incomplete foundation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql -X -v ON_ERROR_STOP=1 -f tools/production-release/assert-first-owner-device-security.sql > /tmp/owner-device-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'OWNER_DEVICE_SECURITY_MISSING_PRIVATE_TABLE' /tmp/owner-device-negative.log
      - name: Create disposable catalog contract and replay seed twice
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/production-release-catalog-contract.sql
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql
      - name: Verify seed rejects incompatible pre-existing catalog atomically
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "UPDATE platform.permissions SET allowed_scope_mode='intentionally_corrupt' WHERE code=(SELECT code FROM platform.permissions WHERE is_system ORDER BY code LIMIT 1)"
          set +e
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql > /tmp/seed-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "Canonical system catalog fingerprint mismatch" /tmp/seed-negative.log
          psql -v ON_ERROR_STOP=1 -c "TRUNCATE platform.role_permissions, platform.permissions, platform.roles RESTART IDENTITY CASCADE"
          psql -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-seed.sql > /dev/null
      - name: Compare catalog fingerprints against Development read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -f tools/production-release/canonical-system-catalog-fingerprint.sql)"
          echo "$result" | grep -Fx 'permissions|84|2225bd16e2d1478d777fba4e3b12afc7'
          echo "$result" | grep -Fx 'role_permissions|79|90e6d71f8203c6789bb6d956daff7cce'
          echo "$result" | grep -Fx 'roles|8|cdd80e0770d5f40e3f70e3ecaf3e9272'
          test "$(echo "$result" | wc -l)" -eq 3
