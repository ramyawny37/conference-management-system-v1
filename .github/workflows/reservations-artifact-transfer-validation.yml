name: Reservations Platform Accessibility Validation

on:
  push:
    branches: [work/reservations-route-accessibility]
    paths:
      - .github/workflows/reservations-artifact-transfer-validation.yml
      - js/reservations-route-accessibility.js
      - tests/platform-reservations-route-accessibility.test.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reservations-route-accessibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Start local PostgreSQL required by platform tests
        run: |
          sudo systemctl start postgresql
          for i in {1..30}; do
            if sudo -u postgres pg_isready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          sudo -u postgres pg_isready
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE runner LOGIN CREATEDB;" || true
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE runner CREATEDB;"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "GRANT postgres TO runner;" || true
      - name: Focused route accessibility regression
        run: node --test tests/platform-reservations-route-accessibility.test.js
      - name: Full platform check
        run: npm run check
      - name: Diff integrity
        run: git diff --check develop...HEAD
