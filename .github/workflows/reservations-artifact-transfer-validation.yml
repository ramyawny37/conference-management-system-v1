name: Reservations Artifact Transfer Validation

on:
  push:
    branches: [work/reservations-route-accessibility]
    paths: [.github/workflows/reservations-artifact-transfer-validation.yml]

permissions:
  contents: write

jobs:
  transfer-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reservations-route-accessibility
          path: platform
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ramyawny37/reservation-management-system
          ref: 545ce6e301e9858fbedfab934bb34427366b50f0
          path: reservations-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reservations-source/package-lock.json
      - working-directory: reservations-source
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build:platform-module
      - name: Verify exact artifact hashes
        run: |
          test "$(sha256sum reservations-source/dist/platform-module/reservations-module.js | awk '{print $1}')" = "9f080e5ebc059b7bd1d5691efceb90f1c06a605a47542a2001ea26c57e3af4ff"
          test "$(sha256sum reservations-source/dist/platform-module/reservations-module.css | awk '{print $1}')" = "ed33c2aed6a12bfaa9e72ede954eeea2fcea138f06695192b510da3f5a8655ab"
      - run: |
          cp reservations-source/dist/platform-module/reservations-module.js platform/modules/reservations/reservations-module.js
          cp reservations-source/dist/platform-module/reservations-module.css platform/modules/reservations/reservations-module.css
      - working-directory: platform
        run: npm run check
      - name: Commit verified artifact to work branch
        working-directory: platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/reservations/reservations-module.js modules/reservations/reservations-module.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(reservations): transfer verified capability artifact"
          git push origin HEAD:work/reservations-route-accessibility
