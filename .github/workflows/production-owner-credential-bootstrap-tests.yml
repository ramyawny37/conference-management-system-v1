name: Production owner credential bootstrap safety tests

on:
  push:
    branches: [develop]
    paths:
      - 'tools/issue-production-owner-credential-bootstrap.cjs'
      - 'tests/production-owner-credential-bootstrap.test.js'
      - '.github/workflows/production-owner-credential-bootstrap-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check tools/issue-production-owner-credential-bootstrap.cjs
          node --check tests/production-owner-credential-bootstrap.test.js
      - name: Run fail-closed tests without production secrets
        run: node --test tests/production-owner-credential-bootstrap.test.js
