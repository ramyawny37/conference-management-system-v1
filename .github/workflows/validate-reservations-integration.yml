name: Validate Reservations integration on develop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Manual validation marker: permits an exact-SHA validation run when path-filtered pushes do not start CI. Exact-SHA refresh 2026-11-10.
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check integration script syntax
        run: node --check tools/integrate-reservations-artifact.cjs
      - name: Check reservations browser bundle syntax
        run: node --check modules/reservations/reservations-module.js
      - name: Reservations apology and refund payout regression
        run: |
          node --test \
            tests/reservations-apology-two-options.test.js \
            tests/reservations-booking-cancellation-settlement.test.js \
            tests/reservations-delete-apology-rebooking-lifecycle.test.js \
            tests/reservations-detail-payment-cache-invalidation.test.js \
            tests/reservations-apology-operational-financial-separation.test.js \
            tests/reservations-apology-readonly-operational-actions.test.js
      - name: Validate source boundary and cache references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const tool = fs.readFileSync('tools/integrate-reservations-artifact.cjs', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          for (const name of ['reservations-module.js', 'reservations-module.css']) {
            if (!tool.includes(name)) throw Error('Integrator missing ' + name);
            if (!index.includes('modules/reservations/' + name)) throw Error('HTML missing ' + name);
            if (!sw.includes('modules/reservations/' + name)) throw Error('SW missing ' + name);
          }
          if (!tool.includes("branch !== 'develop'")) throw Error('Missing develop guard');
          if (!tool.includes("crypto.createHash('sha256')")) throw Error('Missing checksum guard');
          const staleRevision = 'reservations-cancellation-settlement-v1';
          const testFiles = require('child_process').execFileSync('find', ['tests', '-maxdepth', '1', '-name', '*.test.js', '-print'], { encoding: 'utf8' }).trim().split(/\n+/).filter(Boolean);
          for (const file of testFiles) {
            if (fs.readFileSync(file, 'utf8').includes(staleRevision)) throw Error('Stale Reservations runtime revision in ' + file);
          }
          console.log('Source boundary and references: PASS');
          NODE
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Conference Development platform regression tests
        run: node --test $(find tests -maxdepth 1 -name 'platform-*.test.js' ! -name 'platform-promotion-readiness.test.js' -print | sort)
      - name: Conference room lock release diagnostics regression
        run: node tests/conference-lock-release-diagnostics.test.js
      - name: Owner synced-passkey canonical policy regression
        run: node tests/system-owner-synced-passkey-policy-reconciliation.test.js
      - name: Canonical accommodation room lifecycle regression
        run: |
          node --test \
            tests/canonical-accommodation-room-draft-save.test.js \
            tests/canonical-accommodation-frontend-cutover-p6d.test.js \
            tests/canonical-accommodation-guardian-child-lifecycle.test.js \
            tests/canonical-accommodation-atomic-replacement.test.js \
            tests/canonical-accommodation-arrivals-room-keys.test.js \
            tests/conference-accommodation-stay-segments.test.js \
            tests/conference-accommodation-nightly-report.test.js \
            tests/platform-conference-accommodation-lifecycle.test.js
      - name: Canonical central conference houses permission regression
        run: node --test tests/canonical-central-conference-houses.test.js
      - name: Reservations identity replay regression
        run: node --test tests/reservations-identity-replay-order.test.js tests/reservations-manual-person-identity-resolution.test.js
      - name: Development preview validation
        if: always()
        run: npm run check:development-preview
