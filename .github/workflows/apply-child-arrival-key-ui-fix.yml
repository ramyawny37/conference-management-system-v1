name: Apply Child Arrival Key UI Fix
on:
  push:
    paths:
      - 'tmp/child-ui-fix-trigger.txt'
    branches: [develop]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch child UI behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text()

          old="""return '<div class=\"accommodation-compact-person\'+(isChild?' is-child':'')+'\"><span class=\"accommodation-compact-name\">'+(isChild?'↳ ':'')+esc(person.fullName||'نزيل بدون اسم')+'</span>'+(keyHolder&&String(keyHolder.occupancyId)===String(occupancy.occupancyId)?'<span class=\"accommodation-compact-key\" title=\"مستلم المفتاح\">🔑</span>':'')+'<button type=\"button\" class=\"accommodation-arrival '+(occupancy.arrivedAt?'arrived':'not-arrived')+'\" '+(canManage?'onclick=\"setCanonicalAccommodationArrival(\\''+occupancy.occupancyId+'\\','+(!occupancy.arrivedAt)+')\"':'disabled')+'>'+(occupancy.arrivedAt?'✓ وصل':'لم يصل')+'</button>'+(isChild?'<small class=\"accommodation-child-bed-badge\">'+canonicalAccommodationChildBedLabel(occupancy)+'</small>':'')+(unlinked?'<small class=\"accommodation-guardian-missing\">ربط ولي الأمر مفقود</small>':'')+'</div>';"""
          new="""return '<div class=\"accommodation-compact-person\'+(isChild?' is-child':'')+'\"><span class=\"accommodation-compact-name\">'+(isChild?'↳ ':'')+esc(person.fullName||'نزيل بدون اسم')+'</span>'+(isChild?'<small class=\"accommodation-child-bed-badge\">'+canonicalAccommodationChildBedLabel(occupancy)+'</small><small class=\"accommodation-child-inherited-badge\">الوصول والمفتاح تابعان للوالد</small>':((keyHolder&&String(keyHolder.occupancyId)===String(occupancy.occupancyId)?'<span class=\"accommodation-compact-key\" title=\"مستلم المفتاح\">🔑</span>':'')+'<button type=\"button\" class=\"accommodation-arrival '+(occupancy.arrivedAt?'arrived':'not-arrived')+'\" '+(canManage?'onclick=\"setCanonicalAccommodationArrival(\\''+occupancy.occupancyId+'\\','+(!occupancy.arrivedAt)+')\"':'disabled')+'>'+(occupancy.arrivedAt?'✓ وصل':'لم يصل')+'</button>'))+(unlinked?'<small class=\"accommodation-guardian-missing\">ربط ولي الأمر مفقود</small>':'')+'</div>';"""
          if s.count(old)!=1: raise SystemExit(f'compact render target count={s.count(old)}')
          s=s.replace(old,new)

          old="""var options=[{label:'إلغاء تسجيل تسليم المفتاح',searchText:'إلغاء',data:null}].concat(occupants.map(function(item){var person=item.person||{};return {label:person.fullName||'نزيل بدون اسم',searchText:[person.fullName||'',person.phone||'',person.church||''].join(' '),data:item};}));"""
          new="""var options=[{label:'إلغاء تسجيل تسليم المفتاح',searchText:'إلغاء',data:null}].concat(occupants.filter(function(item){return !isCanonicalAccommodationChild(item);}).map(function(item){var person=item.person||{};return {label:person.fullName||'نزيل بدون اسم',searchText:[person.fullName||'',person.phone||'',person.church||''].join(' '),data:item};}));"""
          if s.count(old)!=1: raise SystemExit(f'key options target count={s.count(old)}')
          s=s.replace(old,new)

          old="""  if(!current||!occupancy)return false;\n  return runCanonicalAccommodationOccupancyMutation(current.id,occupancy.occupancyId,function(){"""
          new="""  if(!current||!occupancy)return false;\n  if(isCanonicalAccommodationChild(occupancy)){showToast('الوصول تابع للوالد ولا يُسجل للطفل بشكل مستقل.','#E74C3C');return false;}\n  return runCanonicalAccommodationOccupancyMutation(current.id,occupancy.occupancyId,function(){"""
          if s.count(old)!=1: raise SystemExit(f'arrival guard target count={s.count(old)}')
          s=s.replace(old,new)

          old="""    if(holder&&!getCanonicalAccommodationOccupanciesOnDay(latestRoom,getConferenceOperationalDay(selectedConference)).some(function(item){return String(item.occupancyId)===String(holder.occupancyId);}))"""
          new="""    if(holder&&isCanonicalAccommodationChild(holder)){showToast('استلام المفتاح تابع للوالد ولا يُسجل للطفل.','#E74C3C');return false;}\n    if(holder&&!getCanonicalAccommodationOccupanciesOnDay(latestRoom,getConferenceOperationalDay(selectedConference)).some(function(item){return String(item.occupancyId)===String(holder.occupancyId);}))"""
          if s.count(old)!=1: raise SystemExit(f'key callback guard target count={s.count(old)}')
          s=s.replace(old,new)

          old="""    return '<div class=\"guest-person-row canonical-room-guest canonical-room-child\" data-bed-type=\"'+bedType+'\" data-canonical-stay=\"'+id+'\"><div class=\"guest-slot-person\"><strong>↳ '+esc(person.fullName||'نزيل بدون اسم')+'</strong>'+(unlinked?'<div class=\"person-meta\">ربط ولي الأمر مفقود</div>':'')+'</div>'+childBed+childActions+'</div>';"""
          new="""    return '<div class=\"guest-person-row canonical-room-guest canonical-room-child\" data-bed-type=\"'+bedType+'\" data-canonical-stay=\"'+id+'\"><div class=\"guest-slot-person\"><strong>↳ '+esc(person.fullName||'نزيل بدون اسم')+'</strong>'+(unlinked?'<div class=\"person-meta\">ربط ولي الأمر مفقود</div>':'')+'</div><small class=\"accommodation-child-inherited-badge\">الوصول والمفتاح تابعان للوالد</small>'+childBed+childActions+'</div>';"""
          if s.count(old)!=1: raise SystemExit(f'child detail target count={s.count(old)}')
          s=s.replace(old,new)

          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/diagnose-child-arrival-key.yml .github/workflows/apply-child-arrival-key-ui-fix.yml tmp/child-policy-trigger.txt tmp/child-ui-fix-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .github/workflows tmp
          git commit -m 'fix: make child arrival and key inherit from guardian'
          git push origin develop