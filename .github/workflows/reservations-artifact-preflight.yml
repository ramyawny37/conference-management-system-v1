name: Reservations artifact integration preflight
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/reservations-artifact-preflight.yml'
      - 'tools/reservations-artifact-policy.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Verify develop has not moved
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify integration utility
        run: |
          node --check tools/integrate-reservations-artifact.cjs
          node --test tests/reservations-artifact-policy.test.js
      - name: Verify artifact access configuration
        env:
          HAS_SOURCE_TOKEN: ${{ secrets.RESERVATIONS_SOURCE_TOKEN != '' }}
        run: |
          if [ "$HAS_SOURCE_TOKEN" = true ]; then
            echo 'Private Reservations artifact access is configured.'
          else
            echo 'Private Reservations artifact access is not configured.'
          fi
      - name: Integrate the single policy-approved Reservations artifact
        env:
          GH_TOKEN: ${{ secrets.RESERVATIONS_SOURCE_TOKEN }}
          SOURCE_REPO: ramyawny37/reservation-management-system
        run: |
          APPROVED_COUNT="$(node -p "require('./tools/reservations-artifact-policy.json').approvedIntegrations.length")"
          if [ "$APPROVED_COUNT" = "0" ]; then
            echo 'No approved artifact pending integration.'
            exit 0
          fi
          test "$APPROVED_COUNT" = "1" || { echo 'RESERVATIONS_ARTIFACT_APPROVAL_COUNT_INVALID'; exit 1; }
          test -n "$GH_TOKEN" || { echo 'RESERVATIONS_SOURCE_TOKEN_REQUIRED'; exit 1; }
          SOURCE_SHA="$(node -p "require('./tools/reservations-artifact-policy.json').approvedIntegrations[0].sourceCommit")"
          RUN_ID="$(gh api "repos/$SOURCE_REPO/actions/runs?head_sha=$SOURCE_SHA&status=success&per_page=20" --jq '.workflow_runs[] | select(.name=="Reservations CI") | .id' | head -n1)"
          test -n "$RUN_ID" || { echo 'No successful exact-SHA Reservations CI run'; exit 1; }
          ARTIFACT_ID="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="reservations-platform-module" and (.expired|not)) | .id' | head -n1)"
          test -n "$ARTIFACT_ID" || { echo 'Exact-SHA Reservations artifact not found'; exit 1; }
          gh api "repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/reservations-platform-module.zip
          node tools/integrate-reservations-artifact.cjs /tmp/reservations-platform-module.zip
          if git diff --quiet; then echo 'No integration changes.'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/reservations/reservations-module.js modules/reservations/reservations-module.css modules/reservations/reservations-contract.json index.html service-worker.js tools/reservations-artifact-policy.json
          git diff --cached --check
          git commit -m "chore(reservations): integrate verified exact-SHA artifact"
          git push origin HEAD:develop
          GH_TOKEN="${{ github.token }}" gh workflow run validate-reservations-integration.yml --repo "$GITHUB_REPOSITORY" --ref develop
