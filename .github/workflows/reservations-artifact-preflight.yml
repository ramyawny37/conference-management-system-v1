name: Reservations artifact integration
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/reservations-artifact-preflight.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical integration policy
        run: |
          node --check tools/integrate-reservations-artifact.cjs
          node --test tests/reservations-artifact-policy.test.js
      - name: Download approved Reservations artifact
        env:
          GH_TOKEN: ${{ secrets.RESERVATIONS_SOURCE_TOKEN }}
          ARTIFACT_ID: '15016463081'
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ramyawny37/reservation-management-system/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/reservations-platform-module.zip
      - name: Integrate approved artifact through the canonical writer
        run: node tools/integrate-reservations-artifact.cjs /tmp/reservations-platform-module.zip
      - name: Commit canonical Reservations runtime cutover
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/reservations/reservations-module.js modules/reservations/reservations-module.css index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Approved Reservations runtime already integrated."
            exit 0
          fi
          git commit -m "integrate(reservations): canonical identity profile runtime"
          git push origin HEAD:develop
