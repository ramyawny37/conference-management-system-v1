name: Reservations artifact integration preflight
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/reservations-artifact-preflight.yml'
      - 'tools/reservations-artifact-policy.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify integration utility
        run: |
          node --check tools/integrate-reservations-artifact.cjs
          node --test tests/reservations-artifact-policy.test.js
      - name: Integrate explicitly approved Reservations artifact
        env:
          GH_TOKEN: ${{ secrets.RESERVATIONS_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(node -p "require('./tools/reservations-artifact-policy.json').approvedIntegrations[0]?.sourceCommit || ''")"
          if [ -z "$SOURCE_SHA" ]; then
            echo "No approved artifact pending."
            exit 0
          fi
          test -n "$GH_TOKEN" || { echo "RESERVATIONS_SOURCE_TOKEN is required"; exit 1; }
          RUN_ID="$(gh api --paginate "/repos/ramyawny37/reservation-management-system/actions/runs?branch=develop&head_sha=$SOURCE_SHA&status=success&per_page=100" --jq '.workflow_runs[] | select(.name=="Reservations CI") | .id' | head -1)"
          test -n "$RUN_ID" || { echo "No successful Reservations CI run for $SOURCE_SHA"; exit 1; }
          ARTIFACT_ID="$(gh api "/repos/ramyawny37/reservation-management-system/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="reservations-platform-module" and (.expired|not)) | .id' | head -1)"
          test -n "$ARTIFACT_ID" || { echo "Approved Reservations artifact not found"; exit 1; }
          gh api "/repos/ramyawny37/reservation-management-system/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/reservations-platform-module.zip
          node tools/integrate-reservations-artifact.cjs /tmp/reservations-platform-module.zip
          if git diff --quiet; then
            echo "No integration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/reservations/reservations-module.js modules/reservations/reservations-module.css modules/reservations/reservations-contract.json index.html service-worker.js tools/reservations-artifact-policy.json
          git commit -m "chore(reservations): integrate approved canonical artifact"
          git push origin HEAD:develop
